[package]
name = "bt-engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bt-engine = { path = "../crates/engine" }

[[bin]]
name = "bencode"
path = "fuzz_targets/bencode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metainfo"
path = "fuzz_targets/metainfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "piece_buffer"
path = "fuzz_targets/piece_buffer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resume"
path = "fuzz_targets/resume.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracker_url"
path = "fuzz_targets/tracker_url.rs"
test = false
doc = false
bench = false

[workspace]

[profile.release]
debug = 1
