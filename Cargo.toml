[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/engine",
    "crates/client",
    "crates/daemon",
    "crates/tui",
    "crates/platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

bt-proto = { path = "crates/proto" }
bt-engine = { path = "crates/engine" }
bt-client = { path = "crates/client" }
bt-platform = { path = "crates/platform" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
